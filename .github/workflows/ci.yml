name: build and test

# Builds on a clean Windows runner and runs the whole template audit as a gate, so a
# regression cannot reach a release. The shared build proves the normal developer setup;
# the static build proves the portable, DLL-free binary that runs on any supported Windows.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Attaching a zip to a release is a write to repository contents, and the default token is
# read-only. Without this the upload step fails with "Resource not accessible by integration"
# after a green build - which is exactly how v3.17.0 shipped with no download.
permissions:
  contents: write

jobs:
  windows:
    name: windows-${{ matrix.link }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
        link: [shared, static]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install meson and ninja
        run: python -m pip install --upgrade meson ninja

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: meson setup build -Ddefault_library=${{ matrix.link }}

      - name: Build
        run: meson compile -C build

      - name: Template audit
        shell: bash
        run: |
          set -e
          T=./build/tools/template_smoke.exe
          echo "--- load and run every template"      && $T
          echo "--- expected output per template"     && $T --probe-test
          echo "--- demo contracts"                   && $T --demo-test
          echo "--- oscillators (frequency + shape)"  && $T --osc-test
          echo "--- current-flow invariants"          && $T --flow-test
          echo "--- switch states"                    && $T --switch-test
          echo "--- named parts vs data sheets"       && $T --part-test
          echo "--- device operating points"          && $T --op-test
          echo "--- subcircuits as IC blocks"         && $T --sub-test
          echo "--- SPICE .SUBCKT import"             && $T --spice-test
          echo "--- crystal impedance vs frequency"   && $T --xtal-test
          echo "--- what the scope actually shows"    && $T --view-test
          echo "--- every pin wired to something"     && $T --conn-test
          echo "--- transmission line reflections"    && $T --line-test
          echo "--- standards limits"                 && $T --std-test
          echo "--- power ratings"                    && $T --burn-test
          echo "--- every adjustable knob"            && $T --knob-test
          echo "--- schematic geometry"               && $T --geom-test

      - name: Headless UI checks
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          CIRCUIT_TOY_NO_UPDATE: '1'
        run: ./build/circuit-playground.exe --layout-test

      # Start the binary this job is about to ship: window, renderer, a template placed, frames
      # drawn, screenshot written. --layout-test above returns before SDL_Init and never builds
      # the App, which is how v3.19.2, v3.20.0 and v3.21.0 all went out crashing with 0xC00000FD
      # a moment after start-up and all passed CI. If the runner cannot open a window at all the
      # step says so and moves on; a binary that starts and then dies is a failure.
      - name: Start the app
        shell: bash
        env:
          CIRCUIT_TOY_NO_UPDATE: '1'
        run: |
          set +e
          rm -f start.bmp
          ./build/circuit-playground.exe --template "RC Low Pass" --size 800x600 \
              --frame 20 --shot start.bmp --exit --no-update-check
          rc=$?
          log="$APPDATA/circuit_toy/circuit-playground/crash.log"
          if [ -f start.bmp ]; then
            echo "started, drew frames and wrote a screenshot (exit $rc)"
            exit 0
          fi
          if [ -f "$log" ] && grep -q "FATAL: SDL_Init failed" "$log"; then
            echo "this runner has no display; skipping (the app never got to open a window)"
            exit 0
          fi
          echo "the app did not start. Its log:"
          [ -f "$log" ] && tail -40 "$log"
          exit 1

      # The stack the crash came out of. 223 KB of App state used to live on it; the state is in
      # static storage now and this is the guard that the reserve stays generous.
      - name: Stack reserve
        shell: bash
        run: |
          python - <<'PY'
          import struct
          d = open('build/circuit-playground.exe','rb').read()
          pe = struct.unpack_from('<I', d, 0x3c)[0]
          reserve = struct.unpack_from('<Q', d, pe + 24 + 72)[0]
          mb = reserve / 1048576
          print('stack reserve %.1f MB' % mb)
          raise SystemExit(0 if mb >= 7.9 else 'reserve too small: %.2f MB' % mb)
          PY

      - name: Upload binary
        if: matrix.link == 'static' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: circuit-playground-static
          path: |
            build/circuit-playground.exe
            README.md
            guide.html

      # A tag should produce something a user can download. The static build needs no DLL, so
      # the zip is the exe, the README and the guide, attached to the release the tag created -
      # which is what "Latest Release" at the top of the README points at.
      - name: Attach the build to the release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.link == 'static' && matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mkdir -p dist/circuit-playground
          cp build/circuit-playground.exe README.md guide.html dist/circuit-playground/
          (cd dist && 7z a -tzip "circuit-playground-windows-$tag.zip" circuit-playground >/dev/null)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "$tag" --generate-notes
          gh release upload "$tag" "dist/circuit-playground-windows-$tag.zip" --clobber
          # Publish only now. A release is what the updater calls "latest": while it exists
          # without its zip, every app that checks for updates quits itself to download a file
          # that is not there. The draft is invisible to the API until this line runs.
          gh release edit "$tag" --draft=false
